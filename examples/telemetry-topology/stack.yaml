# The telemetry services the SDK talks to, for clusters without the OASEES stack:
# the real OASEES telemetry API, and Prometheus behind a thanos-query service
# (the SDK only uses the /api/v1/query endpoint, which both serve).
apiVersion: v1
kind: Pod
metadata: {name: telemetry-api, labels: {app: telemetry-api}}
spec:
  nodeSelector: {node-role.kubernetes.io/master: "true"}
  containers: [{name: api, image: "oasees/oasees-telemetry-api:latest", ports: [{containerPort: 5005}, {containerPort: 8000}]}]
---
apiVersion: v1
kind: Service
metadata: {name: oasees-telemetry-api-svc}
spec:
  selector: {app: telemetry-api}
  ports: [{name: ws, port: 5005, targetPort: 5005}, {name: prom, port: 8000, targetPort: 8000}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: prometheus-config}
data:
  prometheus.yml: |
    global: {scrape_interval: 2s}
    scrape_configs:
    - job_name: oasees-telemetry
      static_configs: [{targets: ["oasees-telemetry-api-svc.default.svc.cluster.local:8000"]}]
---
apiVersion: v1
kind: Pod
metadata: {name: prometheus, labels: {app: prometheus}}
spec:
  nodeSelector: {node-role.kubernetes.io/master: "true"}
  containers:
  - name: prometheus
    image: prom/prometheus:v2.53.2
    args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumeMounts: [{name: config, mountPath: /etc/prometheus}]
  volumes: [{name: config, configMap: {name: prometheus-config}}]
---
apiVersion: v1
kind: Service
metadata: {name: thanos-query}
spec:
  selector: {app: prometheus}
  ports: [{port: 9090, targetPort: 9090}]
