name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # numpy is pinned to 1.26.4, which only has wheels up to Python 3.12
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package the way a user would
        run: python -m pip install .

      - name: Check that the CLI starts
        run: oasees-sdk --help

      - name: Install test tools
        # flask is only needed by the inference-template tests
        run: python -m pip install pytest flask

      - name: Run the tests
        run: python -m pytest tests -q
